version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: BookSnaps-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    networks:
      - BookSnaps-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: BookSnaps-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - BookSnaps-network
    restart: unless-stopped

networks:
  BookSnaps-network:
    driver: bridge